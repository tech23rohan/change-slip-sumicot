<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup</title>
</head>
<body>
  <h2>Login or Signup</h2>

  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQK1w4m25GEs3erR0o5Z-V4M5GcmeKyx4",
      authDomain: "change-slip.firebaseapp.com",
      projectId: "change-slip",
      storageBucket: "change-slip.appspot.com",
      messagingSenderId: "865872159179",
      appId: "1:865872159179:web:ebadb70171283f6133d64e",
      measurementId: "G-ZJNH2CJ8NK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.signup = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => alert("Signup Successful!"))
        .catch((error) => alert(error.message));
    };

    window.login = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Login Successful!");
          window.location.href = "upload.html";
        })
        .catch((error) => alert(error.message));
    };
  </script>
</body>
</html>
